[package]
name = "redis_pool"
version = "0.10.1"
authors = ["Andrew Wheeler <genusistimelord@gmail.com>",  "Wil Gaboury"]
description = "Library to Provide a redis client and cluster client pools."
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["Redis", "Pool", "tokio"]
repository = "https://github.com/AscendingCreations/RedisPool"

[features]
cluster = ["redis/cluster-async"]

[dependencies]
tokio = { version = "1.53.1", features = ["sync"] }
async-trait = "0.1.92"
tracing = "0.1.44"
thiserror = "2.0.20"
redis = { version = "1.5.0", features = ["aio", "tokio-comp"]}
crossbeam-queue = "0.3.13"
parking_lot = "0.12.5"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process"] }
testcontainers = "0.14.0"
anyhow = "1.0.104"
futures = "0.3.33"
redis_pool = { path = ".", features = ["cluster"]}
serial_test = "3.2.0"